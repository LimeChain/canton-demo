services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: canton-demo-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./config/keycloak/canton-demo-realm.json:/opt/keycloak/data/import/canton-demo-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - canton-demo

  canton-synchronizer:
    build:
      context: ./docker
      args:
        CANTON_VERSION: "3.5.1"
    image: canton-demo-canton:3.5.1
    container_name: canton-demo-synchronizer
    environment:
      CANTON_CONFIG: /config/synchronizer.conf
      CANTON_BOOTSTRAP: /bootstrap/bootstrap-synchronizer.canton
      JAVA_OPTS: "-Xms256m -Xmx1g"
    volumes:
      - ./config/synchronizer.conf:/config/synchronizer.conf:ro
      - ./config/bootstrap-synchronizer.canton:/bootstrap/bootstrap-synchronizer.canton:ro
      - synchronizer-data:/data
    ports:
      - "5001:5001"
      - "5002:5002"
      - "5202:5202"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5001'"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - canton-demo

  pqs-postgres:
    image: postgres:16-alpine
    container_name: canton-demo-pqs-postgres
    environment:
      POSTGRES_USER: canton
      POSTGRES_PASSWORD: canton
      POSTGRES_DB: postgres
    volumes:
      - ./config/postgres/init-pqs.sql:/docker-entrypoint-initdb.d/init-pqs.sql:ro
    ports:
      - "65432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canton -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - canton-demo

  participant-bank:
    build:
      context: ./docker
      args:
        CANTON_VERSION: "3.5.1"
    image: canton-demo-canton:3.5.1
    container_name: canton-demo-participant-bank
    depends_on:
      keycloak:
        condition: service_healthy
      canton-synchronizer:
        condition: service_healthy
    environment:
      CANTON_CONFIG: /config/participant-bank.conf
      CANTON_BOOTSTRAP: /bootstrap/bootstrap-participant.canton
      SYNCHRONIZER_ALIAS: demo
      SYNCHRONIZER_URL: http://canton-synchronizer:5001
      JAVA_OPTS: "-Xms256m -Xmx1g"
    volumes:
      - ./config/participant-bank.conf:/config/participant-bank.conf:ro
      - ./config/bootstrap-participant.canton:/bootstrap/bootstrap-participant.canton:ro
      - participant-bank-data:/data
    ports:
      - "5011:5011"
      - "5012:5012"
      - "5013:5013"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5011'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  pqs-bank:
    image: europe-docker.pkg.dev/da-images/public/docker/participant-query-store:3.5.1
    container_name: canton-demo-pqs-bank
    depends_on:
      keycloak:
        condition: service_healthy
      participant-bank:
        condition: service_healthy
      pqs-postgres:
        condition: service_healthy
    command:
      - pipeline
      - ledger
      - postgres-document
      - --pipeline-ledger-start
      - Genesis
      - --pipeline-filter-parties
      - "*"
      - --source-ledger-host
      - participant-bank
      - --source-ledger-port
      - "5011"
      - --source-ledger-auth
      - OAuth
      - --pipeline-oauth-clientid
      - canton-demo-pqs
      - --pipeline-oauth-clientsecret
      - canton-demo-pqs-secret
      - --pipeline-oauth-endpoint
      - http://keycloak:8080/realms/canton-demo/protocol/openid-connect/token
      - --pipeline-oauth-scope
      - daml_ledger_api
      - --target-postgres-host
      - pqs-postgres
      - --target-postgres-port
      - "5432"
      - --target-postgres-database
      - pqs_bank
      - --target-postgres-username
      - canton
      - --target-postgres-password
      - canton
      - --target-schema-autoapply
      - "true"
      - --health-address
      - 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  participant-users:
    build:
      context: ./docker
      args:
        CANTON_VERSION: "3.5.1"
    image: canton-demo-canton:3.5.1
    container_name: canton-demo-participant-users
    depends_on:
      keycloak:
        condition: service_healthy
      canton-synchronizer:
        condition: service_healthy
    environment:
      CANTON_CONFIG: /config/participant-users.conf
      CANTON_BOOTSTRAP: /bootstrap/bootstrap-participant.canton
      SYNCHRONIZER_ALIAS: demo
      SYNCHRONIZER_URL: http://canton-synchronizer:5001
      JAVA_OPTS: "-Xms256m -Xmx1g"
    volumes:
      - ./config/participant-users.conf:/config/participant-users.conf:ro
      - ./config/bootstrap-participant.canton:/bootstrap/bootstrap-participant.canton:ro
      - participant-users-data:/data
    ports:
      - "5021:5011"
      - "5022:5012"
      - "5023:5013"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5011'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  pqs-users:
    image: europe-docker.pkg.dev/da-images/public/docker/participant-query-store:3.5.1
    container_name: canton-demo-pqs-users
    depends_on:
      keycloak:
        condition: service_healthy
      participant-users:
        condition: service_healthy
      pqs-postgres:
        condition: service_healthy
    command:
      - pipeline
      - ledger
      - postgres-document
      - --pipeline-ledger-start
      - Genesis
      - --pipeline-filter-parties
      - "*"
      - --source-ledger-host
      - participant-users
      - --source-ledger-port
      - "5011"
      - --source-ledger-auth
      - OAuth
      - --pipeline-oauth-clientid
      - canton-demo-pqs
      - --pipeline-oauth-clientsecret
      - canton-demo-pqs-secret
      - --pipeline-oauth-endpoint
      - http://keycloak:8080/realms/canton-demo/protocol/openid-connect/token
      - --pipeline-oauth-scope
      - daml_ledger_api
      - --target-postgres-host
      - pqs-postgres
      - --target-postgres-port
      - "5432"
      - --target-postgres-database
      - pqs_users
      - --target-postgres-username
      - canton
      - --target-postgres-password
      - canton
      - --target-schema-autoapply
      - "true"
      - --health-address
      - 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  participant-observer:
    build:
      context: ./docker
      args:
        CANTON_VERSION: "3.5.1"
    image: canton-demo-canton:3.5.1
    container_name: canton-demo-participant-observer
    depends_on:
      keycloak:
        condition: service_healthy
      canton-synchronizer:
        condition: service_healthy
    environment:
      CANTON_CONFIG: /config/participant-observer.conf
      CANTON_BOOTSTRAP: /bootstrap/bootstrap-participant.canton
      SYNCHRONIZER_ALIAS: demo
      SYNCHRONIZER_URL: http://canton-synchronizer:5001
      JAVA_OPTS: "-Xms256m -Xmx1g"
    volumes:
      - ./config/participant-observer.conf:/config/participant-observer.conf:ro
      - ./config/bootstrap-participant.canton:/bootstrap/bootstrap-participant.canton:ro
      - participant-observer-data:/data
    ports:
      - "5031:5011"
      - "5032:5012"
      - "5033:5013"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5011'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  pqs-observer:
    image: europe-docker.pkg.dev/da-images/public/docker/participant-query-store:3.5.1
    container_name: canton-demo-pqs-observer
    depends_on:
      keycloak:
        condition: service_healthy
      participant-observer:
        condition: service_healthy
      pqs-postgres:
        condition: service_healthy
    command:
      - pipeline
      - ledger
      - postgres-document
      - --pipeline-ledger-start
      - Genesis
      - --pipeline-filter-parties
      - "*"
      - --source-ledger-host
      - participant-observer
      - --source-ledger-port
      - "5011"
      - --source-ledger-auth
      - OAuth
      - --pipeline-oauth-clientid
      - canton-demo-pqs
      - --pipeline-oauth-clientsecret
      - canton-demo-pqs-secret
      - --pipeline-oauth-endpoint
      - http://keycloak:8080/realms/canton-demo/protocol/openid-connect/token
      - --pipeline-oauth-scope
      - daml_ledger_api
      - --target-postgres-host
      - pqs-postgres
      - --target-postgres-port
      - "5432"
      - --target-postgres-database
      - pqs_observer
      - --target-postgres-username
      - canton
      - --target-postgres-password
      - canton
      - --target-schema-autoapply
      - "true"
      - --health-address
      - 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: on-failure
    networks:
      - canton-demo

  backend:
    image: node:22-alpine
    container_name: canton-demo-backend
    working_dir: /app
    command: sh -lc "npm install && npm run start:dev"
    volumes:
      - ./backend:/app
      - ./packages/shared:/packages/shared:ro
      - ./.demo:/demo:ro
      - backend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      pqs-postgres:
        condition: service_healthy
      participant-bank:
        condition: service_healthy
      participant-users:
        condition: service_healthy
      participant-observer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - canton-demo

  frontend:
    image: node:22-alpine
    container_name: canton-demo-frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - ./packages/shared:/packages/shared:ro
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      - canton-demo

networks:
  canton-demo:
    driver: bridge

volumes:
  synchronizer-data:
  participant-bank-data:
  participant-users-data:
  participant-observer-data:
  backend-node-modules:
  frontend-node-modules:
